[package]
name = "kugou-lite"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "all-widgets"] }
crossterm = "0.29"
qrcode = { version = "0.4", default-features = false }
serde_json = "1"

# Keep cell diffing, text layout and spectrum rendering fast for cargo run.
[profile.dev]
opt-level = 2
